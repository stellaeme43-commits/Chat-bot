<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONNECT Chat</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#10121c;color:white;
  font-family:Arial,sans-serif
}
header{
  padding:18px;background:#191c2b;
  color:#a78bfa;font-size:25px;font-weight:bold
}
main{max-width:600px;margin:auto;padding:15px}
.card{
  background:#1c2030;padding:18px;
  border-radius:16px;margin-bottom:15px
}
input,button{
  width:100%;padding:13px;margin:6px 0;
  border-radius:10px;border:none;font-size:15px
}
input{background:#10121c;color:white;border:1px solid #383c50}
button{background:#8b5cf6;color:white;font-weight:bold}
button:disabled{opacity:.5}
.small{font-size:12px;color:#aab0c5}
#app,#chatScreen{display:none}
#status{font-size:13px;color:#c4b5fd}
#users{margin-top:12px}
.user{
  padding:13px;background:#272b3e;
  border-radius:10px;margin-top:8px
}
.user button{width:auto;float:right;padding:8px}
#messages{
  height:300px;overflow-y:auto;
  background:#10121c;padding:10px;border-radius:10px
}
.msg{
  background:#343951;padding:10px;
  margin:8px 0;border-radius:10px;
  overflow-wrap:anywhere
}
.mine{background:#6845b7;text-align:right}
.row{display:flex;gap:6px}
.row input{flex:1;min-width:0}
.row button{width:90px}
.hidden{display:none!important}
</style>
</head>

<body>
<header>CONNECT 💬</header>

<main>
  <div class="card">
    <div id="status">Connect with people, wherever they are.</div>
  </div>

  <section id="auth" class="card">
    <h2>Welcome to CONNECT</h2>
    <p class="small">Create an account or log in.</p>

    <input id="email" type="email"
      placeholder="Email address" autocomplete="email">

    <input id="password" type="password"
      placeholder="Password (at least 6 characters)"
      autocomplete="current-password">

    <button id="signup">Create account</button>
    <button id="login">Log in</button>

    <p id="authStatus" class="small"></p>
  </section>

  <section id="app">
    <div class="card">
      <h2>Your contacts</h2>
      <p class="small">
        Search by email address to find another registered user.
      </p>
      <input id="search" type="email"
        placeholder="Friend's email address">
      <button id="find">Find friend</button>
      <div id="users"></div>
      <button id="logout">Log out</button>
    </div>
  </section>

  <section id="chatScreen" class="card">
    <button id="back">← Back to contacts</button>
    <h3 id="chatTitle">Private chat</h3>
    <div id="messages"></div>
    <div class="row">
      <input id="messageInput" placeholder="Write a message...">
      <button id="send">Send</button>
    </div>
    <p class="small" id="chatStatus"></p>
  </section>
</main>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

/*
 SETUP REQUIRED:
 1. Create a project at https://supabase.com
 2. Open Project Settings -> API.
 3. Paste your Project URL and publishable key below.
 NEVER put a secret/service-role key in this file.
*/
const SUPABASE_URL = 'PASTE_YOUR_SUPABASE_PROJECT_URL';
const SUPABASE_KEY = 'PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY';

const configured =
  SUPABASE_URL.startsWith('https://') &&
  !SUPABASE_URL.includes('PASTE_') &&
  !SUPABASE_KEY.includes('PASTE_');

const status = document.getElementById('status');
const authStatus = document.getElementById('authStatus');

if (!configured) {
  status.textContent =
    'Setup needed: connect your Supabase project to activate chat.';
} else {
  startApp();
}

async function startApp() {
  const { createClient } = await import(
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
  );
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  let me = null;
  let friend = null;
  let channel = null;
  let poll = null;

  const $ = id => document.getElementById(id);

  $('signup').onclick = async () => {
    const { error } = await db.auth.signUp({
      email: $('email').value.trim(),
      password: $('password').value
    });
    authStatus.textContent = error
      ? error.message
      : 'Account request sent. Check your email if confirmation is required.';
  };

  $('login').onclick = async () => {
    const { data, error } = await db.auth.signInWithPassword({
      email: $('email').value.trim(),
      password: $('password').value
    });
    if (error) authStatus.textContent = error.message;
    else await showApp(data.user);
  };

  $('logout').onclick = async () => {
    stopChat();
    await db.auth.signOut();
    me = null;
    $('app').style.display = 'none';
    $('chatScreen').style.display = 'none';
    $('auth').style.display = 'block';
    status.textContent = 'You are logged out.';
  };

  async function showApp(user) {
    me = user;
    $('auth').style.display = 'none';
    $('app').style.display = 'block';
    $('chatScreen').style.display = 'none';
    status.textContent = 'Logged in as ' + user.email;
  }

  $('find').onclick = async () => {
    const email = $('search').value.trim().toLowerCase();
    if (!email || email === me.email.toLowerCase()) {
      $('users').textContent = 'Enter another user’s email address.';
      return;
    }
    $('users').textContent =
      'User discovery needs a secure public profiles table. We will add this in the database setup.';
  };

  $('back').onclick = () => {
    stopChat();
    $('chatScreen').style.display = 'none';
    $('app').style.display = 'block';
  };

  function stopChat() {
    if (channel) db.removeChannel(channel);
    channel = null;
    if (poll) clearInterval(poll);
    poll = null;
    friend = null;
  }

  function addMessage(message) {
    const item = document.createElement('div');
    item.className = 'msg' +
      (message.sender_id === me.id ? ' mine' : '');
    item.textContent = message.body;
    $('messages').appendChild(item);
    $('messages').scrollTop = $('messages').scrollHeight;
  }

  async function loadMessages() {
    if (!friend) return;
    const { data, error } = await db
      .from('messages')
      .select('id,sender_id,body,created_at')
      .or(
        `and(sender_id.eq.${me.id},recipient_id.eq.${friend.id}),` +
        `and(sender_id.eq.${friend.id},recipient_id.eq.${me.id})`
      )
      .order('created_at')
      .limit(100);

    if (error) {
      $('chatStatus').textContent =
        'Database setup required: ' + error.message;
      return;
    }
    $('messages').replaceChildren();
    data.forEach(addMessage);
  }

  async function openChat(user) {
    stopChat();
    friend = user;
    $('app').style.display = 'none';
    $('chatScreen').style.display = 'block';
    $('chatTitle').textContent = 'Chat with ' + user.email;
    $('messages').replaceChildren();
    await loadMessages();

    channel = db.channel('messages-' + me.id)
      .on('postgres_changes', {
        event: 'INSERT',
        schema: 'public',
        table: 'messages'
      }, payload => {
        const m = payload.new;
        if (
          (m.sender_id === me.id && m.recipient_id === friend?.id) ||
          (m.sender_id === friend?.id && m.recipient_id === me.id)
        ) loadMessages();
      }).subscribe();
  }

  $('send').onclick = async () => {
    const body = $('messageInput').value.trim();
    if (!body || !friend) return;

    $('send').disabled = true;
    const { error } = await db.from('messages').insert({
      sender_id: me.id,
      recipient_id: friend.id,
      body
    });
    $('send').disabled = false;

    if (error) $('chatStatus').textContent = error.message;
    else {
      $('messageInput').value = '';
      await loadMessages();
    }
  };

  const { data } = await db.auth.getSession();
  if (data.session) await showApp(data.session.user);

  db.auth.onAuthStateChange((_event, session) => {
    if (session) showApp(session.user);
  });
}
</script>
</body>
</html>
